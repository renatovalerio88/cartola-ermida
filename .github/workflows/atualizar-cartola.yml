name: Atualizar Cartola

on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-cartola
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Consultar status e decidir tarefas
        id: mercado
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          URL = "https://api.cartola.globo.com/mercado/status"
          TOTAL_TIMES = 36

          def buscar_status():
              ultimo_erro = None
              for tentativa in range(1, 4):
                  try:
                      req = urllib.request.Request(
                          URL,
                          headers={
                              "Accept": "application/json",
                              "User-Agent": "Mozilla/5.0",
                              "Cache-Control": "no-cache",
                          },
                      )
                      with urllib.request.urlopen(req, timeout=20) as resposta:
                          return json.loads(resposta.read().decode("utf-8"))
                  except Exception as erro:
                      ultimo_erro = erro
                      print(f"Tentativa {tentativa}/3 falhou: {erro}")
                      if tentativa < 3:
                          time.sleep(tentativa * 2)
              raise RuntimeError(f"Não foi possível consultar o status: {ultimo_erro}")

          def carregar_json_local(caminho):
              try:
                  with open(caminho, "r", encoding="utf-8") as arquivo:
                      return json.load(arquivo)
              except (FileNotFoundError, json.JSONDecodeError):
                  return {}

          def carregar_historico():
              try:
                  with open("historico_cartola.json", "r", encoding="utf-8") as arquivo:
                      return json.load(arquivo)
              except (FileNotFoundError, json.JSONDecodeError):
                  return {}

          status = buscar_status()
          execucao_manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"

          rodada = int(status.get("rodada_atual", 0) or 0)
          status_mercado = int(status.get("status_mercado", 0) or 0)
          mercado_aberto = status_mercado == 1
          bola_rolando = bool(status.get("bola_rolando", False))

          historico = carregar_historico()
          rodada_atual_local = carregar_json_local("rodada_atual_cartola.json")

          ultima_fechada = int(historico.get("ultima_rodada_fechada", 0) or 0)
          rodada_fechada = rodada - 1 if mercado_aberto else 0

          registros = (
              historico.get("rodadas", {}).get(str(rodada_fechada), [])
              if rodada_fechada > 0
              else []
          )

          precisa_historico = (
              mercado_aberto
              and rodada_fechada > 0
              and (
                  execucao_manual
                  or ultima_fechada < rodada_fechada
                  or len(registros) != TOTAL_TIMES
              )
          )

          # REGRA PRINCIPAL:
          # mercado fechado (status != 1) = rodada em andamento ou transição.
          # Nessa situação SEMPRE executamos atualizar_rodada_atual.py,
          # para buscar /atletas/pontuados e recalcular as parciais dos 36 times.
          # Quando o mercado está aberto, só atualizamos se houver mudança de estado.
          rodada_local = int(rodada_atual_local.get("rodada_cartola", 0) or 0)
          dados_local = int(rodada_atual_local.get("rodada_dados", 0) or 0)
          mercado_local = bool(rodada_atual_local.get("mercado_aberto", False))
          rodada_em_andamento_local = bool(
              rodada_atual_local.get("rodada_em_andamento", False)
          )

          if not mercado_aberto:
              precisa_atualizar_atual = True
          else:
              precisa_atualizar_atual = (
                  execucao_manual
                  or rodada_local != rodada
                  or dados_local != rodada_fechada
                  or mercado_local is not True
                  or rodada_em_andamento_local
              )

          print(f"Execução manual: {execucao_manual}")
          print(f"Rodada Cartola: {rodada}")
          print(f"Status mercado: {status_mercado}")
          print(f"Mercado aberto: {mercado_aberto}")
          print(f"Bola rolando: {bola_rolando}")
          print(f"Última rodada fechada registrada: {ultima_fechada}")
          print(f"Rodada a consolidar: {rodada_fechada}")
          print(f"Precisa atualizar histórico: {precisa_historico}")
          print(f"Precisa atualizar dados atuais: {precisa_atualizar_atual}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"rodada={rodada}\n")
              out.write(f"status={status_mercado}\n")
              out.write(f"mercado_aberto={'true' if mercado_aberto else 'false'}\n")
              out.write(f"bola_rolando={'true' if bola_rolando else 'false'}\n")
              out.write(f"precisa_historico={'true' if precisa_historico else 'false'}\n")
              out.write(
                  f"precisa_atualizar_atual="
                  f"{'true' if precisa_atualizar_atual else 'false'}\n"
              )
          PY

      - name: Atualizar status e dados da rodada atual
        if: steps.mercado.outputs.precisa_atualizar_atual == 'true'
        run: |
          python scripts/atualizar_rodada_atual.py

      - name: Execução leve sem alterações
        if: steps.mercado.outputs.precisa_atualizar_atual != 'true' && steps.mercado.outputs.precisa_historico != 'true'
        run: |
          echo "Mercado aberto e dados oficiais já consolidados."
          echo "Nenhuma consulta aos 36 times foi necessária nesta execução."

      - name: Consolidar rodada fechada no histórico
        if: steps.mercado.outputs.precisa_historico == 'true'
        run: |
          python scripts/atualizar_cartola.py

      - name: Salvar arquivos atualizados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração real nos dados. Nada para enviar."
            exit 0
          fi

          git commit -m "Atualiza dados do Cartola"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
